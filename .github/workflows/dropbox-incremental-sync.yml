name: Dropbox Incremental Sync
run-name: Dropbox Incremental Sync (${{ github.event_name }})

on:
  schedule:
    # GitHub schedule is best-effort; avoid minute 00 where queue load is highest.
    - cron: "2/5 * * * *"
      timezone: "Asia/Saigon"
  workflow_dispatch:
  repository_dispatch:
    types:
      - dropbox-incremental-sync

permissions:
  contents: read

concurrency:
  group: dong-dropbox-incremental-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 30
    env:
      DONG_ENVIRONMENT: Prod
      DONG_DROPBOX_VAR_PREFIX: SANDBOX
      SANDBOX_DROPBOX_APP_KEY: ${{ secrets.SANDBOX_DROPBOX_APP_KEY || vars.SANDBOX_DROPBOX_APP_KEY }}
      SANDBOX_DROPBOX_APP_SECRET: ${{ secrets.SANDBOX_DROPBOX_APP_SECRET || vars.SANDBOX_DROPBOX_APP_SECRET }}
      SANDBOX_DROPBOX_REFRESH_TOKEN: ${{ secrets.SANDBOX_DROPBOX_REFRESH_TOKEN || vars.SANDBOX_DROPBOX_REFRESH_TOKEN }}
      SANDBOX_DROPBOX_ROOT: ${{ vars.SANDBOX_DROPBOX_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write Dropbox env
        shell: bash
        run: |
          missing=0
          for name in SANDBOX_DROPBOX_APP_KEY SANDBOX_DROPBOX_APP_SECRET SANDBOX_DROPBOX_REFRESH_TOKEN SANDBOX_DROPBOX_ROOT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it under GitHub Actions variables for this workflow."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          {
            echo "DONG_ENVIRONMENT=${DONG_ENVIRONMENT}"
            echo "DONG_DROPBOX_VAR_PREFIX=${DONG_DROPBOX_VAR_PREFIX}"
            echo "SANDBOX_DROPBOX_APP_KEY=${SANDBOX_DROPBOX_APP_KEY}"
            echo "SANDBOX_DROPBOX_APP_SECRET=${SANDBOX_DROPBOX_APP_SECRET}"
            echo "SANDBOX_DROPBOX_REFRESH_TOKEN=${SANDBOX_DROPBOX_REFRESH_TOKEN}"
            echo "SANDBOX_DROPBOX_ROOT=${SANDBOX_DROPBOX_ROOT}"
          } > .env.local

      - name: Run incremental sync
        run: node scripts/local_incremental_sync.js --env .env.local
