  /* ---- client compute (mirrors ProjectService.computeP15/16) ------------- */
  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function pad3(n) {
    var s = String(round2(Number(n) || 0));
    while (s.length < 3) s = '0' + s;
    return s;
  }
  function computeP14(codeRows, timeRows) {
    return (codeRows || []).map(function (row) {
      var actual = 0;
      (timeRows || []).forEach(function (t) {
        if (String(t.code || '') === String(row.code || '')) actual += Number(t.hours) || 0;
      });
      var planned = Number(row.planned || 0);
      actual = round2(actual);
      planned = round2(planned);
      var next = cloneJson(row, {});
      next.planned = planned;
      next.actual = actual;
      next.plannedDisplay = pad3(planned);
      next.actualDisplay = pad3(actual);
      next.hoursDisplay = next.plannedDisplay + ' | ' + next.actualDisplay;
      return next;
    });
  }
  function computeP15(times, code) {
    var order = [], groups = {};
    (times || []).forEach(function (t) {
      if (code && t.code !== code) return;
      var key = t.task || '(none)';
      if (!groups[key]) { groups[key] = { task: key, hours: 0, accounts: [], lastSerial: -1, lastDay: '' }; order.push(key); }
      var g = groups[key]; g.hours += Number(t.hours) || 0;
      if (t.account && g.accounts.indexOf(t.account) < 0) g.accounts.push(t.account);
      var sr = Number(t.dateSerial) || 0; if (sr > g.lastSerial) { g.lastSerial = sr; g.lastDay = t.dateString; }
    });
    return order.map(function (k) { var x = groups[k]; return { task: x.task, hours: round2(x.hours), accounts: x.accounts, lastDay: x.lastDay }; });
  }
  function computeP16(rows) { var s = 0; (rows || []).forEach(function (r) { s += Number(r.hours) || 0; }); return round2(s); }
  function progressPercent(totalHours, estimate) {
    var est = Number(estimate);
    if (!isFinite(est) || est <= 0) return '';
    if (totalHours == null || totalHours === '') return '';
    return String(Math.max(0, Math.min(999, Math.round((Number(totalHours) || 0) * 100 / est))));
  }
  function allProjectHours() {
    if (S.bundle && S.bundle.timeTotalAll != null) return Number(S.bundle.timeTotalAll || 0);
    return S.bundle && S.bundle.p16All != null ? Number(S.bundle.p16All || 0) : null;
  }
  function currentProgressPercent(project) {
    var total = allProjectHours();
    if (total == null) return project && project.progress != null ? String(project.progress || '') : '';
    return progressPercent(total, project && project.P7_estimate);
  }
  function codeTimePercent(row) {
    var planned = Number(row && row.planned || 0);
    var actual = Number(row && row.actual || 0);
    if (row && row.percent != null && row.hasPlan !== false) return Number(row.percent) || 0;
    if (!isFinite(planned) || planned <= 0) return actual > 0 ? 999 : 0;
    return Math.max(0, Math.round(actual * 100 / planned));
  }
  function codeTimeBattery(row, mobile) {
    row = row || {};
    var planned = round2(Number(row.planned || 0));
    var actual = round2(Number(row.actual || 0));
    var pct = codeTimePercent(row);
    var fill = planned > 0 ? Math.max(0, Math.min(100, pct)) : 0;
    var hasPlan = row.hasPlan !== false && planned > 0;
    var tone = !hasPlan && actual > 0 ? 'no-plan' : pct > 100 ? 'over' : pct >= 85 ? 'high' : pct >= 50 ? 'mid' : 'low';
    var label = !hasPlan && actual > 0 ? 'No plan' : (pct + '%');
    var detail = 'Plan: ' + planned + 'h | Act: ' + actual + 'h';
    return '<div class="time-spent-bar ' + tone + (mobile ? ' mobile' : '') + '" title="' + esc(detail) + '" aria-label="' + esc('Time spent ' + label + '. ' + detail) + '" tabindex="0">' +
      '<div class="time-meter" role="img" aria-hidden="true"><span style="width:' + fill + '%"></span><b>' + esc(label) + '</b></div>' +
      '<small>' + esc(detail) + '</small></div>';
  }

  function pollPublicStatus() {
    clearTimeout(S.statusPoll);
    gas('apiGetPublicSyncStatus').then(function (res) {
      var payload = dataOf(res);

      var prev = S.cfg && S.cfg.syncStatus || {};
      var prevState = String(S.lastPublicSyncState || prev.state || '').toLowerCase();
      if (S.cfg) {

      S.indexMeta = {

      if (autoOpen && !S.bundle) {

    $('summaryBar').innerHTML =

          controlClass: 'status-select ' + formatStatusClass(projectValue('P6_status')) + statusCustomClass(projectValue('P6_status')),

          controlStyleAttr: statusStyleAttr(projectValue('P6_status'))
        }) +
        cockpitInput('Assign', 'P13_assignee', p ? projectValue('P13_assignee') : '', { kind: 'select', options: enumOptions('projectAssignees', projectValue('P13_assignee')) }) +
        cockpitInput('Start', 'P10_startDate', p ? projectValue('P10_startDate') : '', { type: 'date' }) +
        cockpitInput('End / Due', 'P11_endDate', p ? projectValue('P11_endDate') : '', { type: 'date' }) +
        cockpitInput('Estimate', 'P7_estimate', p ? projectValue('P7_estimate') : '', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*' }) +

        progressMetric() +
        planMetric() +
      '</div>';

    var search = $('jobSearch');
    search.value = S.searchOpen || S.search ? S.search : selectedProjectDisplay();

      renderSearchSuggestions();

      if (!S.search) {

    if ($('detailsBtn')) $('detailsBtn').addEventListener('click', function () { S.detailsOpen = !S.detailsOpen; renderProjectOverview(); renderSummaryBar(); });

  function indexUsesDirectFileSearch() {
    return !!(S.indexMeta && S.indexMeta.directFileSearch);
  }
  function searchCurrentIndex(query, limit) {
    return window.DongSearch.searchLocation(S.jobs, query, { limit: limit || 30 });
  }
  function renderSearchSuggestions() {
    var mount = $('jobSuggestions'), input = $('jobSearch');
    if (!mount || !input) return;
    var query = String(S.search || '').trim();
    if (!S.searchOpen || !query) {
      mount.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); return;
    }
    if (S.indexLoading && !S.jobs.length) {
      mount.innerHTML = '<div class="suggestion-state">Loading project index...</div>';
      mount.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true'); return;
    }
    var found = searchCurrentIndex(query, 30);
    S.searchResults = found.items; S.searchTotal = found.total;
    if (!found.items.length) {
      mount.innerHTML = '<div class="suggestion-state">' + (indexUsesDirectFileSearch() ? 'Location index is not ready yet' : 'No locations found') + '</div>';
    } else {
      prefetchTopResults(found.items);
      mount.innerHTML = found.items.map(function (j, index) {
        return window.DongSearch.renderLocationSuggestion(j, query, index, index === S.searchActive, statusBadge);
      }).join('') + (found.total > found.items.length ? '<div class="suggestion-count">Showing ' + found.items.length + ' of ' + found.total + ' matches</div>' : '');
    }
    mount.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true');
    [].forEach.call(mount.querySelectorAll('[data-suggestion-index]'), function (el) {
      el.addEventListener('mousedown', function (e) { e.preventDefault(); selectSearchResult(Number(el.getAttribute('data-suggestion-index'))); });
      el.addEventListener('mouseenter', function () {
        var item = S.searchResults[Number(el.getAttribute('data-suggestion-index'))];
        if (item) queueDetailPrefetch(recordKey(item));
      });
      el.addEventListener('focus', function () {
        var item = S.searchResults[Number(el.getAttribute('data-suggestion-index'))];
        if (item) queueDetailPrefetch(recordKey(item));
      });
    });
  }
  function selectSearchResult(index) {
    var item = S.searchResults[index];
    if (!item) return;
    S.search = '';
    S.searchOpen = false; S.searchActive = -1;
    openJob(recordKey(item));
  }
  function handleSearchKeydown(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!S.searchOpen) S.searchOpen = true;
      if (!S.searchResults.length) {
        var found = searchCurrentIndex(S.search, 30);
        S.searchResults = found.items; S.searchTotal = found.total;
      }
      S.searchActive = window.DongSearch.moveIndex(S.searchActive, e.key === 'ArrowDown' ? 1 : -1, S.searchResults.length);
      renderSearchSuggestions();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var enterResults = searchCurrentIndex(S.search, 30);
      S.searchResults = enterResults.items; S.searchTotal = enterResults.total;
      var choice = window.DongSearch.enterChoice(S.searchResults, S.search, S.searchActive);
      if (choice) selectSearchResult(S.searchResults.indexOf(choice));
      else { S.searchOpen = true; renderSearchSuggestions(); toast(indexUsesDirectFileSearch() ? 'No matching project file.' : 'No matching location.', 'error'); }
    } else if (e.key === 'Escape') {
      S.searchOpen = false; S.searchActive = -1; renderSearchSuggestions();
    }
  }
  function openJobNumberSearch(value) {
    var jobNo = String(value || '').trim();
    if (!jobNo || jobNo === currentJobNo()) return;
    if (!/^\d+$/.test(jobNo)) { toast('Enter a numeric job number.', 'error'); return; }
    if (S.indexLoading && !S.jobs.length) { toast('Project index is still loading. Try again in a moment.'); return; }
    var match = window.DongSearch.findExactJob(S.jobs, jobNo);
    if (!match) { toast('No job found with number ' + jobNo + '.', 'error'); return; }
    S.search = '';
    S.searchOpen = false;
    openJob(recordKey(match));
  }

  /* =========================================================================
   * OPEN A JOB
   * ====================================================================== */
  function setProjectFreshnessState(state, message) {
    S.projectFreshnessState = state || '';
    if (state === 'cached') setSync('syncing', message || 'Showing cached data.');
    else if (state === 'checking') setSync('syncing', message || 'Checking Dropbox for updates...');
    else if (state === 'current') setSync('ok', message || 'Data is up to date.');
    else if (state === 'update_available') setSync('syncing', message || 'Newer Dropbox data is available.');
    else if (state === 'refreshing') setSync('syncing', message || 'Refreshing project from Dropbox...');
    else if (state === 'full_rebuild_required') setSync('bad', message || 'Dropbox change history must be rebuilt before this project can be verified.');
    else if (state === 'refresh_failed') setSync('bad', message || 'Could not check Dropbox. Cached data is still shown.');
  }
  function handleFreshnessResult(jobNo, requestId, data) {
    if (requestId !== S.freshnessRequestId || String(S.selectedJobNo) !== String(jobNo)) return Promise.resolve(null);
    data = data || {};
    if (data.state === 'full_rebuild_required' || data.errorCode === 'DROPBOX_CURSOR_RESET') {
      setProjectFreshnessState('full_rebuild_required');
      return Promise.resolve(data);
    }
    if (data.shouldFetchDetail || data.state === 'server_update_available' || data.state === 'update_available') {
      if (dirtyCount()) {
        S.lastConflict = { message: 'Newer Dropbox data is available. Reload latest and keep your edits before applying.', conflicts: [] };
        setProjectFreshnessState('update_available');
        renderEditFooter();
        return Promise.resolve(data);
      }
      return requestProjectDetail(jobNo, { bypassCache: true }).then(function (latest) {
        if (requestId !== S.freshnessRequestId || String(S.selectedJobNo) !== String(jobNo) || dirtyCount()) return latest;
        S.bundle = normalizeBundleJob(latest, jobNo);
        beginEditBase(S.bundle);
        S.lastRefreshAt = latest.lastRefreshAt || new Date().toISOString();
        renderDetail();
        renderHeader();
        setProjectFreshnessState('current');
        return latest;
      });
    }
    if (data.state === 'sync_queued' || data.state === 'sync_running' || data.state === 'checking_dropbox') {
      setProjectFreshnessState('checking');
      pollPublicStatus();
    } else {
      setProjectFreshnessState('current');
    }
    return Promise.resolve(data);
  }
  function refreshVisibleProjectIfSafe(reason) {
    var projectKey = currentProjectKey();
    if (!projectKey || backgroundRefreshBlocked()) return Promise.resolve(null);
    return requestProjectDetail(projectKey, { bypassCache: true }).then(function (latest) {
      if (String(currentProjectKey() || '') !== String(projectKey) || backgroundRefreshBlocked()) return latest;
      S.bundle = normalizeBundleJob(latest, projectKey);
      beginEditBase(S.bundle);
      Cache.remove(detailCacheKey(projectKey));
      syncIndexRecordFromBundle(S.bundle);
      S.lastRefreshAt = latest.lastRefreshAt || new Date().toISOString();
      renderDetail();
      renderHeader();
      renderEditFooter();
      return latest;
    }).catch(function (e) {
      setSync('bad', 'Project detail refresh failed');
      toast('Project detail refresh failed: ' + (e.message || e), 'error');
      return null;
    });
  }
  function checkProjectFreshness(jobNo, mode) {
    var requestId = ++S.freshnessRequestId;
    setProjectFreshnessState('checking');
    return gas('apiCheckProjectFreshness', S.adminToken, jobNo, currentProjectVersion(), { mode: mode || 'check' }).then(function (res) {
      return handleFreshnessResult(jobNo, requestId, dataOf(res));
    }).catch(function (e) {
      if (requestId !== S.freshnessRequestId || String(S.selectedJobNo) !== String(jobNo)) return null;
      setProjectFreshnessState('refresh_failed');
      toast('Could not check Dropbox: ' + (e.message || e), 'error');
      return null;
    });
  }
  function openJob(jobNo, forceRefresh) {
    if (!jobNo) return;
    var requestId = ++S.openRequestId;
    var projectKey = String(jobNo);
    S.selectedJobNo = projectKey;
    S.selectedCode = null; S.selectedPlan = ''; S.editing = false; S.editDraft = null; S.detailsOpen = false; S.timeSummaryOpen = false; resetDirty(); S.codePage = 0; S.timePage = 0;
    syncEditingLayout();
    var cacheKey = detailCacheKey(projectKey);
    var cached = !forceRefresh && Cache.get(cacheKey);
    var record = getJobRecord(projectKey);
    var displayJobNo = record && record.jobNo || projectKey;
    if (cached && cached.bundle) {
      S.bundle = normalizeBundleJob(cached.bundle, projectKey);
      S.bundle.loadingDetail = false;
      beginEditBase(S.bundle);
      S.lastRefreshAt = cached.atIso || '';
      renderDetail(); renderHeader();
      setProjectFreshnessState('cached', 'Showing cached data.');
    } else if (record) {
      S.bundle = normalizeBundleJob(buildProjectStub(record, projectKey), projectKey);
      beginEditBase(S.bundle);
      S.lastRefreshAt = '';
      renderDetail(); renderHeader();
      setSync('syncing', 'Opening ' + displayJobNo + '…');
    } else {
      ['overviewMount', 'notesMount', 'descMount', 'controlsMount', 'codeMount', 'timeMount'].forEach(function (m) { $(m).innerHTML = skCard(); });
      setSync('syncing', 'Opening ' + displayJobNo + '…');
    }
    $('currentProjectBadge').classList.toggle('loading', true);
    requestProjectDetail(projectKey, { forceRefresh: !!forceRefresh }).then(function (data) {
      if (requestId !== S.openRequestId || String(S.selectedJobNo) !== String(projectKey)) return;
      S.bundle = normalizeBundleJob(data, projectKey);
      S.bundle.loadingDetail = false;
      beginEditBase(S.bundle);
      S.lastRefreshAt = data.lastRefreshAt || new Date().toISOString();
      renderDetail();
      renderHeader();
      setProjectFreshnessState('checking');
    }).catch(function (e) {
      if (requestId !== S.openRequestId || String(S.selectedJobNo) !== String(projectKey)) return;
      if (!cached) {
        $('overviewMount').innerHTML = '<div class="inline-error">Could not open ' + esc(displayJobNo) + ': ' + esc(e.message || e) + '</div>';
        ['notesMount', 'descMount', 'controlsMount', 'codeMount', 'timeMount'].forEach(function (m) { $(m).innerHTML = ''; });
      }
      setSync('bad', cached ? 'Showing cached data' : 'Open failed');
      toast((cached ? 'Refresh failed; showing cached data: ' : 'Open failed: ') + (e.message || e), 'error');
    }).then(function () {
      if (requestId === S.openRequestId && String(S.selectedJobNo) === String(projectKey)) checkProjectFreshness(projectKey, forceRefresh ? 'refresh' : 'check');
    }).then(function () { $('currentProjectBadge').classList.toggle('loading', false); });
  }

  function refreshCurrentProject() {
    var projectKey = currentProjectKey();
    var jobNo = currentJobNo();
    if (!projectKey) return;
    var requestId = ++S.refreshRequestId;
    var dirtyPayload = dirtyPayloadFromState();
    setProjectFreshnessState('refreshing');
    gas('apiRequestProjectIndexSync', S.adminToken).then(function () {
      return waitForSyncPublish(currentProjectVersion().publishToken);
    }).then(function (sync) {
      if (requestId !== S.refreshRequestId || String(currentProjectKey()) !== String(projectKey)) return null;
      if (!sync || String(sync.state || '').toLowerCase() !== 'completed') {
        var code = sync && sync.errorCode || 'SYNC_FAILED';
        if (code === 'DROPBOX_CURSOR_RESET') setProjectFreshnessState('full_rebuild_required');
        else setProjectFreshnessState('refresh_failed');
        return null;
      }
      return requestProjectDetail(projectKey, { bypassCache: true });
    }).then(function (latest) {
      if (!latest || requestId !== S.refreshRequestId || String(currentProjectKey()) !== String(projectKey)) return;
      if (Object.keys(dirtyPayload.projectPatch || {}).length || (dirtyPayload.codePatches || []).length) {
        rebaseLatestBundle(latest, dirtyPayload);
        toast('Your changes were rebased onto the latest Dropbox version. Review them, then Apply again.', 'success');
      } else {
        S.bundle = normalizeBundleJob(latest, projectKey);
        beginEditBase(S.bundle);
        resetDirty();
        renderDetail();
        renderHeader();
      }
      setProjectFreshnessState('current');
    }).catch(function (e) {
      if (requestId !== S.refreshRequestId) return;
      setProjectFreshnessState(e && e.code === 'DROPBOX_CURSOR_RESET' ? 'full_rebuild_required' : 'refresh_failed');
      toast('Refresh failed: ' + (e.message || e), 'error');
    });
  }

    var start = p.P10_startDate || S.bundle.project.P10_startDate;
    var end = p.P11_endDate || S.bundle.project.P11_endDate;
    function serial(v) {
      var iso = usDateToIso(v);

    if ((p.P10_startDate && !serial(p.P10_startDate)) || (p.P11_endDate && !serial(p.P11_endDate))) return 'Enter valid dates.';

  function createUser() {
    var payload = {
      username: $('newUserName').value.trim(),
      displayName: $('newUserDisplay').value.trim(),
      role: $('newUserRole').value,
      temporaryPassword: $('newUserPassword').value
    };
    setAdminOut('Creating user...');
    gas('apiCreateUser', S.adminToken, payload).then(function (res) {
      var created = dataOf(res);
      S.users = (S.users || []).filter(function (u) { return u.username !== created.username; }).concat([created]);

      if (S.adminTab === 'users') renderAdminPanel();

  function saveUser(username) {

      '<div class="metric"><b>' + esc(sync.status || 'idle') + '</b><span>Sync status</span></div>' +
      '<div class="metric"><b>' + esc(sync.mode || '-') + '</b><span>Mode</span></div>' +
      '<div class="metric"><b>' + esc(sync.phase || '-') + '</b><span>Phase</span></div>' +
      '<div class="metric"><b>' + Number(health.triggers && health.triggers.workerTriggerCount || 0) + '</b><span>Worker trigger</span></div>' +
      '</div>' +
      '<div class="queue-section"><div class="section-title">Current sync</div>' +
        '<div class="job-row ' + esc(sync.status || 'idle') + '"><div class="job-main">' +
          '<div><b>' + esc((sync.mode || 'none') + ' / ' + (sync.status || 'idle')) + '</b><span class="muted">' + esc(sync.runId || '') + '</span></div>' +
          '<div class="progress-track"><span style="width:' + pct + '%"></span></div>' +
          '<span class="muted progress-detail">' + pct + '% | ' + processed + ' / ' + total + '</span>' +
          '<span class="muted">heartbeat ' + esc(formatRefresh(sync.heartbeatAt || '')) +
            (sync.errorCode ? ' | ' + esc(sync.errorCode) : '') +
            (sync.error ? ' | ' + esc(sync.error) : '') + '</span>' +
        '</div></div></div>' +
      (sync.status === 'running' ? '<div class="validation-box warning">Sync worker is active. Use Sync Status for cancel.</div>' : '<div class="validation-box good">No sync is running right now.</div>') +
      taskCard('Generator', g) +
      '<div class="background-refresh-bar"><span id="backgroundRefreshNote">Last checked ' + esc(formatRefresh(d.now || '')) + '</span></div>';
  }
  function setBackgroundRefreshNote(text, tone) {
    var el = $('backgroundRefreshNote');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'background-refresh-note ' + (tone || '');
  }
  function loadBackgroundStatus() {
    clearTimeout(S.backgroundPoll);
    var out = $('backgroundOut');
    if (out && !S.backgroundStatus) out.innerHTML = sk(2);
    else setBackgroundRefreshNote('Refreshing jobs...', 'loading');
    gas('apiGetBackgroundStatus', S.adminToken).then(function (res) {
      var d = dataOf(res); S.backgroundStatus = d;
      if ($('backgroundOut')) $('backgroundOut').innerHTML = renderBackgroundStatus(d);
      var sync = d.syncHealth && d.syncHealth.sync || d.sync || {};
      if (S.adminTab === 'background' && (sync.status === 'running' || /^(running|publishing|cancel_requested|pause_requested|waiting_for_lock)$/.test(d.generator && d.generator.state || ''))) {
        S.backgroundPoll = setTimeout(loadBackgroundStatus, 5000);
      }
    }).catch(function (e) {
      setBackgroundRefreshNote('Refresh failed: ' + (e && e.message || e), 'error');
      adminError(e);
    });
  }
  function pollGenerator() {
    clearTimeout(S.generatorPoll);
    gas('apiGetGeneratorStatus', S.adminToken).then(function (res) {
      var d = dataOf(res); renderGeneratorProgress(d);
      if ((d.state === 'running' || d.state === 'publishing' || d.state === 'cancel_requested' || d.state === 'pause_requested') && S.adminTab === 'generator') {
        S.generatorPoll = setTimeout(function () {
          pollGenerator();
        }, d.state === 'cancel_requested' ? 2000 : 5000);
      } else if (d.state === 'failed') {
        setAdminOut('Generator failed: ' + (d.lastError || 'See generator errors.'));
      } else if (d.state === 'waiting_for_lock') {
        setAdminOut('Generator is waiting for the Apps Script lock; another background task is still active.');
      } else if (d.state === 'cancelled') {
        setAdminOut('Generator cancelled. You can generate more data or clean the sandbox.');
      } else if (d.state === 'paused') {
        setAdminOut('Generator paused. Click Resume to continue from the saved offset.');
      } else if (d.state === 'killed') {
        setAdminOut('Generator killed. You can start a new run now.');
      } else if (d.state === 'completed' && d.publishedAt) {
        setAdminOut('✓ Background run completed. Data is ready to search.', true);
        loadIndex(true);
      }
    }).catch(function () {});
  }
  function publishGeneratedData(d) {
    if (Number(d.totalFilesTarget || 0) > 2500) {
      setAdminOut('Generation is disabled in this production-safe build. Open Sync Status and use Sync now for existing data.');
      return;
    }
    S.generatorPublishing = true;
    setAdminOut('Source files ready. Building project index now…');
    gas('apiPublishGeneratedDataset', S.adminToken).then(function (res) {
      var published = dataOf(res);
      S.generatorPublishing = false;
      renderGeneratorProgress(published.generator);
      setAdminOut('✓ Random data generated and indexed. Projects are ready to search.', true);
      toast('Generated data is ready.', 'success');
      loadIndex(true);
      loadAdminConfig(S.adminCfg.selected.environment);
    }).catch(function (e) {
      S.generatorPublishing = false;
      adminError(e);
    });
  }
  function cancelGenerator() {
    setAdminOut('Cancelling generator run…');
    gas('apiCancelGenerator', S.adminToken).then(function (res) {
      var d = dataOf(res);
      renderGeneratorProgress(d);
      toast(d.cancelRequested === false ? 'No active generator run to cancel.' : 'Generator cancellation requested.');
      if (S.adminTab === 'background') loadBackgroundStatus();
      pollGenerator();
    }).catch(adminError);
  }
  function generatorCommand(apiName, busyText, successText) {
    setAdminOut(busyText);
    gas(apiName, S.adminToken).then(function (res) {
      var d = dataOf(res);
      renderGeneratorProgress(d);
      toast(successText, 'success');
      if (S.adminTab === 'background') loadBackgroundStatus();
      else pollGenerator();
    }).catch(adminError);
  }
  function resetSyncJobs() {
    if (!window.confirm('Cancel current sync? This does not delete source files or the active index.')) return;
    setAdminOut('Cancelling current sync...');
    gas('apiResetSyncJobs', S.adminToken).then(function (res) {
      var d = dataOf(res);
      setAdminOut('Current sync was cancelled.', true);
      toast('Current sync cancelled.', 'success');
      loadBackgroundStatus();
      pollSyncStatus();
    }).catch(adminError);
  }
  function killGenerator() {
    if (!window.confirm('Kill the current generator run? Already uploaded files will stay in the sandbox manifest until cleanup/reset.')) return;
    generatorCommand('apiKillGenerator', 'Killing generator run…', 'Generator killed.');
  }
  function repairBackground() {
    setAdminOut('Repairing background triggers…');
    gas('apiRepairBackgroundJobs', S.adminToken).then(function (res) {
      var d = dataOf(res);
      setAdminOut('✓ Background repair completed: ' + JSON.stringify(d), true);
      loadBackgroundStatus();
    }).catch(adminError);
  }
  function sandboxCleanup(apiName) {
    var confirmation = $('resetConfirm').value.trim();
    gas(apiName, S.adminToken, confirmation).then(function (res) {
      setAdminOut('✓ Cleanup completed: ' + esc(JSON.stringify(dataOf(res))), true); toast('Sandbox cleanup completed.', 'success');
    }).catch(adminError);
  }
  function runBenchmark() {
    $('benchmarkOut').innerHTML = sk(3);
    gas('apiRunBenchmark', S.adminToken, { runIncremental: true, runFullRebuild: $('benchFull').checked }).then(function (res) {
      var d = dataOf(res);
      $('benchmarkOut').innerHTML = '<div class="metric-grid"><div class="metric"><b>' + d.scenarios.indexLoad.ms + ' ms</b><span>Index load</span></div>' +
        '<div class="metric"><b>' + d.scenarios.detailLoad.p95Ms + ' ms</b><span>Detail p95</span></div><div class="metric"><b>' + d.scenarios.search.totalMs + ' ms</b><span>100 searches</span></div>' +
        '<div class="metric"><b>' + d.totalMs + ' ms</b><span>Total benchmark</span></div></div><pre class="json-output">' + esc(JSON.stringify(d, null, 2)) + '</pre>';
    }).catch(adminError);
  }
  function loadBenchmarks() {
    gas('apiGetBenchmarkRuns', S.adminToken).then(function (res) {
      $('benchmarkOut').innerHTML = '<pre class="json-output">' + esc(JSON.stringify(dataOf(res), null, 2)) + '</pre>';
    }).catch(adminError);
  }
  function loadDiagnostics() {
    gas('apiGetDiagnostics', S.adminToken).then(function (res) {
      $('benchmarkOut').innerHTML = '<pre class="json-output">' + esc(JSON.stringify(dataOf(res), null, 2)) + '</pre>';
    }).catch(adminError);
  }
  function loadErrors() {
    $('errorOut').innerHTML = sk(3);
    gas('apiGetErrorReport', S.adminToken).then(function (res) {
      var d = dataOf(res), rows = (d.errors || []).slice(-200);
      $('errorOut').innerHTML = '<p><b>' + Number(d.total || 0) + '</b> recorded parser/data errors.</p>' +
        (rows.length ? '<div class="error-table">' + rows.map(function (x) {
          return '<div class="error-row"><b>' + esc(x.code) + '</b><span>' + esc(x.path || x.filename) + '</span><span>' + esc(x.message) + '</span></div>';
        }).join('') + '</div>' : '<div class="folder-empty">No errors.</div>');
    }).catch(adminError);
  }
  function loadSyncLog(force) {
    if (!S.adminToken) return;
    if (S.syncIssueLogLoading && !force) return;
    S.syncIssueLogLoading = true;
    if ($('cfgOut')) setAdminOut('Refreshing log...');
    gas('apiGetSyncIssueLog', S.adminToken).then(function (res) {
      var d = dataOf(res);
      S.syncIssueLog = d.rows || [];
      if (S.adminCfg && S.adminCfg.selected) S.adminCfg.selected.syncIssueLog = S.syncIssueLog;
      if (S.adminTab === 'log') renderAdminPanel();
      if ($('cfgOut')) setAdminOut('Log refreshed.', true);
    }).catch(adminError).then(function () { S.syncIssueLogLoading = false; });
  }
  function setAdminOut(text, good) {
    var out = $('cfgOut'); if (out) out.innerHTML = '<span class="test-line ' + (good ? 'good' : '') + '">' + esc(text) + '</span>';
  }
  function adminError(e) {
    if (e.code === 'UNAUTHORIZED') { S.adminToken = ''; S.session = null; clearAuthToken(); renderLogin('Session expired. Please sign in again.'); return; }
    setAdminOut('Error: ' + e.message); toast(e.message, 'error');
    if (S.adminTab === 'generator') pollGenerator();
  }
  function syncHasMorePending(payload) {
    payload = payload || {};
    var result = payload.result || payload;
    return result && result.morePending === true;
  }
  function runSyncCommand(apiName, pendingText, successText, attempt) {
    attempt = Number(attempt || 0);
    setAdminOut(pendingText);
    setSync('syncing', pendingText);
    pollSyncStatus();
    S.syncPoll = setTimeout(pollSyncStatus, STATUS_POLL_MANUAL_MS);
    return gas(apiName, S.adminToken).then(function (res) {
      var d = dataOf(res);
      if (d && d.accepted === false) throw Object.assign(new Error(d.errorCode || 'Request was not accepted'), d);
      if (syncHasMorePending(d) && attempt < 40) {
        var pendingJobs = Number(d.result && d.result.pendingJobs || 0);
        var nextText = pendingJobs ? ('Incremental sync still has ' + pendingJobs + ' job(s). Continuing...') : 'Incremental sync still has pending work. Continuing...';
        setAdminOut(nextText);
        setSync('syncing', nextText);
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(runSyncCommand(apiName, nextText, successText, attempt + 1)); }, SYNC_CONTINUE_MS);
        });
      }
      setAdminOut(successText, true);
      toast(successText, 'success');
      pollSyncStatus();
      return d;
    }).catch(function (e) {
      setAdminOut('Error: ' + (e.errorCode || e.message || e));
      toast(e.errorCode || e.message || e, 'error');
      pollSyncStatus();
      throw e;
    });
  }
  function checkDropboxChanges() {
    return runSyncCommand('apiRequestIncrementalSync', 'Checking Dropbox changes...', 'Incremental sync complete.');
  }
  function cancelCurrentSync() {
    return runSyncCommand('apiCancelCurrentSync', 'Cancelling current sync...', 'Current sync cancellation requested.');
  }
  function syncNow() {
    return checkDropboxChanges();
  }
  function setAutoSync(enabled) {
    setAdminOut((enabled ? 'Turning on' : 'Turning off') + ' auto sync...');
    gas('apiSetAutoSyncEnabled', S.adminToken, enabled).then(function (res) {
      var d = dataOf(res);
      if (S.cfg && d.autoSync) S.cfg.autoSync = d.autoSync;
      if (S.cfg && d.syncStatus) S.cfg.syncStatus = d.syncStatus;
      if (S.cfg && d.syncHealth) S.cfg.syncHealth = d.syncHealth;
      if (d.syncHealth) S.syncHealth = d.syncHealth;
      if (S.adminCfg && S.adminCfg.selected) {
        if (d.autoSync) S.adminCfg.selected.autoSync = d.autoSync;
        if (d.syncStatus) S.adminCfg.selected.syncStatus = d.syncStatus;
        if (d.syncHealth) S.adminCfg.selected.syncHealth = d.syncHealth;
      }
      setAdminOut(enabled ? 'Auto sync is on.' : 'Auto sync is off. Manual rebuild can run without the 5-minute trigger.', true);
      toast(enabled ? 'Auto sync enabled.' : 'Auto sync disabled.', 'success');
      loadAdminConfig(S.adminCfg && S.adminCfg.selected && S.adminCfg.selected.environment);
      pollSyncStatus();
    }).catch(adminError);
  }
  function pollSyncStatus() {
    clearTimeout(S.syncPoll);
    gas('apiGetSyncHealthSnapshot', S.adminToken).then(function (res) {
      var d = dataOf(res);
      S.syncHealth = d;
      if (S.adminCfg && S.adminCfg.selected) S.adminCfg.selected.syncHealth = d;
      if (S.adminTab === 'sync') updateSyncProgressPanel(d);
      var state = d && d.sync && d.sync.status;
      var health = d && d.health || {};
      if (state === 'completed' || state === 'idle') {
        setSync('ok', health.message || 'Sync complete');
        if (S.adminCfg && S.adminCfg.selected) loadAdminConfig(S.adminCfg.selected.environment);
        loadIndex(false);
      } else if (/^failed|error/.test(state || '')) {
        setSync('bad', health.message || 'Sync failed');
      } else if (state === 'running') {
        setSync('syncing', health.message || 'Sync operation active');
      }
      if (state === 'running' && S.adminTab === 'sync') {
        S.syncPoll = setTimeout(pollSyncStatus, STATUS_POLL_ACTIVE_MS);
      }
    }).catch(function () {});
  }
  function runTests() {
    var out = $('cfgOut'); out.innerHTML = 'Running tests…';
    gas('apiRunTests', S.adminToken).then(function (res) {
      var r = dataOf(res);
      var lines = r.results.map(function (x) { return '<div class="test-line ' + (x.ok ? 'good' : 'bad') + '">' + (x.ok ? '✓' : '✗') + ' ' + esc(x.label) + (x.ok ? '' : ' (got ' + esc(JSON.stringify(x.actual)) + ')') + '</div>'; });
      out.innerHTML = '<div style="margin-bottom:6px"><b>' + (r.fail === 0 ? '✅ PASS' : '❌ FAIL') + '</b> — ' + r.pass + ' passed, ' + r.fail + ' failed</div>' + lines.join('');
    }).catch(function (e) { out.innerHTML = '<span class="test-line bad">Tests failed: ' + esc(e.message || e) + '</span>'; });
  }

  window.addEventListener('load', init);
})();
</script>
