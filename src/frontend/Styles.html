<style>
  :root {
    --bg: #f6f8fb; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #eff6ff;
    --success: #16a34a; --success-soft: #ecfdf3; --warning: #f59e0b; --warning-soft: #fffbeb;
    --danger: #dc2626; --danger-soft: #fef2f2;
    --radius: 8px; --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 30px rgba(15,23,42,.07);
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.5; padding-bottom: env(safe-area-inset-bottom); }
  .hidden { display: none !important; }
  .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
  body.auth-locked .app-shell { display: none !important; }
  body.auth-ready .login-screen { display: none !important; }
  body:not(.booting) .boot-screen { display: none !important; }
  body.booting .login-screen, body.booting .app-shell { display: none !important; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  b, strong { font-weight: 650; }
  code { font-family: var(--mono); background: #f1f3f7; padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

  /* ---------- header ---------- */
  .boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background:
    radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 32%),
    var(--bg); }
  .boot-card { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px; display: grid; gap: 13px; }
  .boot-card h1 { margin: 10px 0 0; font-size: 24px; }
  .boot-card p { margin: 0; color: var(--muted); }
  .boot-progress { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .boot-progress span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width .22s ease; }
  .boot-percent { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); }
  .login-card { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
  .login-card h1 { margin: 8px 0 0; font-size: 24px; }
  .login-card p { margin: 0; color: var(--muted); }
  .login-brand { align-items: center; }
  .login-error { min-height: 20px; color: var(--danger); font-size: 12.5px; font-weight: 700; }
  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--line); padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top));
    position: sticky; top: 0; z-index: 40; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand-title { font-size: 18px; font-weight: 800; letter-spacing: 0; white-space: nowrap; }
  .brand-do { color: var(--primary); } .brand-ng { color: #94a3b8; }
  .brand-sub { font-size: 12px; font-weight: 600; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
  .mode-badge { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; }
  .mode-badge b { color: var(--primary-dark); text-transform: uppercase; letter-spacing: .04em; }
  .mode-badge.production-env { background: var(--danger-soft); border-color: var(--danger); }
  .mode-badge.production-env b { color: var(--danger); }
  .sync-pill { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); background: var(--card); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .loaded-pill { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--primary-soft); color: var(--primary-dark); padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer; min-height: 32px; }
  .loaded-pill:hover { border-color: var(--primary); }
  .loaded-pill.loading::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  .loaded-pill.current-project { background: var(--card); color: var(--text); }
  .loaded-pill.icon-only { width: 34px; padding: 5px; justify-content: center; }
  .last-refresh { flex: 0 1 auto; max-width: 340px; min-width: 0; color: var(--muted); font-size: 11px; white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; }
  .session-pill { flex: 0 0 auto; font: inherit; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 5px 9px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  .session-pill:hover { border-color: var(--primary); color: var(--primary-dark); }
  .default-admin-warning { max-width: 260px; color: #92400e; background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 55%, var(--line)); padding: 5px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .icon-btn { width: 34px; padding: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  .dot.ok { background: var(--success); } .dot.bad { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; background: var(--card); border-bottom: 1px solid var(--line); padding: 0 16px; overflow-x: auto; position: sticky; top: 56px; z-index: 30; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; padding: 13px 14px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font: inherit; font-weight: 600; padding: 9px 15px; border-radius: var(--radius-sm); cursor: pointer; min-height: 40px; transition: background .12s, box-shadow .12s; }
  .btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.light { background: var(--card); color: var(--text); border-color: var(--line); }
  .btn.light:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn.ghost { background: transparent; color: var(--primary-dark); border-color: transparent; }
  .btn.ghost:hover { background: var(--primary-soft); }
  .btn.sm { min-height: 32px; padding: 6px 11px; font-size: 12.5px; }
  .btn.danger { background: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { filter: brightness(.95); }

  /* ---------- layout ---------- */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 18px 20px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card + .card { margin-top: 14px; }
  .app-footer { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--card) 92%, transparent); margin-top: 18px; }
  .footer-inner { max-width: 1440px; margin: 0 auto; padding: 14px 20px 24px; display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 12px; }
  .footer-inner #footerProduct { color: var(--text); font-weight: 700; }
  .footer-inner #footerVersion { font-family: var(--mono); }
  .section-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .section-title .spacer { margin-left: auto; }
  .section-title .pcode { color: #94a3b8; font-weight: 700; }
  .hint { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none; }

  .workbench-grid { display: grid; grid-template-columns: minmax(260px, .68fr) minmax(0, 1.62fr); gap: 14px; align-items: stretch; min-height: min(64vh, 720px); }
  .workbench-notes, .workbench-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .workbench-notes #notesMount, .workbench-main #codeMount { flex: 1 1 auto; min-height: 330px; }
  .workbench-main #timeMount { flex: 0 0 auto; }
  .details-card { margin-bottom: 14px; }
  .pm-col { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .edit-footer-mount { margin-top: 14px; }

  /* ---------- summary bar ---------- */
  .summary-bar { display: grid; gap: 12px; margin-bottom: 14px; padding: 14px 16px; min-height: 0; }
  .cockpit-head { display: grid; grid-template-columns: minmax(220px, 330px) minmax(280px, 1fr); gap: 10px; align-items: end; }
  .job-number-box { min-width: 0; }
  .job-number-control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
  .job-number-control #detailsBtn { min-height: 42px; white-space: nowrap; }
  .job-number-shell input { font-family: var(--mono); font-weight: 850; }
  .cockpit-search { min-width: 0; }
  .combo-shell { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); padding: 4px 8px; min-height: 42px; }
  .combo-shell:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .combo-shell input { border: 0; box-shadow: none; padding: 5px 2px; min-height: 30px; }
  .combo-shell input:focus { box-shadow: none; }
  .cockpit-grid { display: grid; grid-template-columns: minmax(130px,1.05fr) minmax(130px,1.05fr) minmax(118px,.86fr) minmax(118px,.86fr) minmax(96px,.7fr) minmax(98px,.72fr) minmax(170px,1.2fr) minmax(124px,.9fr); gap: 9px; align-items: stretch; }
  .cockpit-field { min-width: 0; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 10px 11px; border: 1px solid color-mix(in srgb, var(--line) 84%, transparent); border-radius: var(--radius-sm); background: linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, var(--bg)), color-mix(in srgb, var(--bg) 55%, var(--card))); }
  .cockpit-field input, .cockpit-field select { width: 100%; min-height: 34px; padding: 5px 8px; font-size: 13px; line-height: 1.2; border-color: color-mix(in srgb, var(--line) 72%, transparent); background: var(--card); box-shadow: none; border-radius: 8px; color: var(--text); }
  .cockpit-field input:hover, .cockpit-field select:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); background: var(--card); }
  .cockpit-field input:focus, .cockpit-field select:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px var(--primary-soft); }
  .cockpit-field.readonly { justify-content: space-between; }
  .cockpit-field.readonly .stat-v { min-height: 34px; display: flex; align-items: center; }
  .stat-k { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .stat-v { font-size: 13px; font-weight: 760; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-v.total { font-size: 15px; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
  .status-metric { border-color: color-mix(in srgb, var(--primary) 20%, var(--line)); }
  .status-metric.s-green, .status-select.s-green { color: #15803d; background: var(--success-soft); }
  .status-metric.s-blue, .status-select.s-blue { color: var(--primary-dark); background: var(--primary-soft); }
  .status-metric.s-amber, .status-select.s-amber { color: #b45309; background: var(--warning-soft); }
  .status-metric.s-orange, .status-select.s-orange { color: #c2410c; background: #fff7ed; }
  .status-metric.s-red, .status-select.s-red { color: #b91c1c; background: var(--danger-soft); }
  .status-metric.s-gray, .status-select.s-gray { color: #475569; background: #f1f5f9; }
  .status-metric.s-purple, .status-select.s-purple { color: #6d28d9; background: #f5f3ff; }
  .status-metric.custom-status, .status-select.custom-status, .status-badge.custom-status { color: var(--status-color); background: color-mix(in srgb, var(--status-color) 12%, var(--card)); border-color: color-mix(in srgb, var(--status-color) 32%, var(--line)); }
  .status-select { font-weight: 750; border-radius: 999px; }
  .progress-metric { gap: 8px; }
  .progress-line { display: flex; align-items: center; gap: 10px; min-height: 34px; }
  .progress-value { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 1px; min-width: 52px; min-height: 30px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font-weight: 850; font-size: 12px; }
  .progress-value.readonly { min-height: 30px; color: var(--text); }
  .mini-progress { flex: 1 1 auto; min-width: 78px; height: 9px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .mini-progress span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .18s ease; }
  .progress-metric.s-red .mini-progress span { background: var(--danger); }
  .progress-metric.s-orange .mini-progress span { background: #f97316; }
  .progress-metric.s-green .mini-progress span { background: var(--success); }
  .project-identity { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
  .identity-title { min-width: 0; font-size: 18px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .identity-title b { color: var(--primary-dark); }
  .identity-title span { color: var(--text); }
  .identity-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; flex-wrap: wrap; justify-content: flex-end; }
  .field-warning { margin-top: 4px; color: var(--danger); font-size: 11px; }
  .job-autocomplete { position: relative; min-width: 0; }
  .job-suggestions { position: absolute; z-index: 55; top: calc(100% + 6px); left: 0; right: 0; max-height: min(360px, 56vh); overflow-y: auto; border: 1px solid color-mix(in srgb, var(--line) 88%, var(--primary) 12%); border-radius: var(--radius); background: var(--card); box-shadow: 0 18px 42px rgba(15,23,42,.14); padding: 6px; }
  .job-suggestions::-webkit-scrollbar { width: 10px; }
  .job-suggestions::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 34%, transparent); border: 3px solid var(--card); border-radius: 999px; }
  .job-suggestion { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; border: 0; border-radius: 7px; background: transparent; color: var(--text); padding: 10px 12px; cursor: pointer; text-align: left; min-height: 58px; }
  .job-suggestion + .job-suggestion { border-top: 1px solid color-mix(in srgb, var(--line) 62%, transparent); }
  .job-suggestion:hover, .job-suggestion.active { background: color-mix(in srgb, var(--primary-soft) 68%, var(--card)); }
  .suggestion-body { min-width: 0; display: grid; gap: 3px; }
  .suggestion-main, .suggestion-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggestion-main b { color: var(--text); font-family: var(--sans); font-size: 13.5px; font-weight: 760; letter-spacing: 0; }
  .suggestion-sub { color: var(--muted); font-size: 12px; }
  .suggestion-right { flex: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 9px; min-width: 178px; }
  .suggestion-assignee { max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .suggestion-progress { flex: none; font-variant-numeric: tabular-nums; }
  .job-suggestion mark, .suggestion-hit { background: color-mix(in srgb, var(--warning) 32%, var(--card)); color: var(--text); border: 1px solid color-mix(in srgb, var(--warning) 50%, transparent); border-radius: 4px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .suggestion-state, .suggestion-count { padding: 13px 12px; color: var(--muted); font-size: 12px; text-align: center; }
  .suggestion-count { border-top: 1px solid var(--line); padding: 8px; }
  .sb-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea { font: inherit; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--text); width: 100%; }
  input:hover, select:hover { border-color: #cbd5e1; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .password-control { position: relative; display: flex; align-items: center; width: 100%; }
  .password-control input { padding-right: 46px; }
  .password-toggle { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 32px; min-height: 28px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .password-toggle:hover, .password-toggle.active { color: var(--primary-dark); background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 24%, var(--line)); }
  .password-toggle:focus { outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }

  /* ---------- info fields (read-only) ---------- */
  .info-grid, .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .info-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .info-field.col-span { grid-column: 1 / -1; }
  .info-field label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .info-field .val { font-size: 14.5px; font-weight: 550; color: var(--text); word-break: break-word; }
  .info-field .val.empty { color: #cbd5e1; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .edit-grid .field.col-span { grid-column: 1 / -1; }
  .details-grid .field.col-span { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.readonly { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--bg) 72%, var(--card)); }
  .field label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .field.compact-detail span { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .readonly-value { font-size: 13.5px; font-weight: 650; color: var(--text); }
  .card-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  #saveMsg { font-size: 12.5px; } #saveMsg.error { color: var(--danger); } #saveMsg.ok { color: var(--success); }
  .save-shell { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .save-copy { display: grid; gap: 4px; }
  .save-copy b { font-size: 15px; }
  .save-copy span { color: var(--muted); font-size: 12px; }
  .save-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .apply-panel { background: color-mix(in srgb, var(--card) 94%, transparent); }
  .pending-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pending-chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--primary-dark); background: var(--primary-soft); font: inherit; font-size: 11.5px; font-weight: 750; cursor: pointer; min-height: 28px; }
  .pending-chip:hover { border-color: var(--primary); }
  .conflict-panel { margin-top: 10px; display: grid; gap: 7px; border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line)); background: var(--danger-soft); color: #991b1b; border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; }
  .conflict-panel span { color: #7f1d1d; }
  .conflict-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .queue-panel { margin-top: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px 10px; border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--line)); background: var(--primary-soft); color: var(--primary-dark); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 12px; }
  .queue-panel.failed { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: var(--danger-soft); color: #991b1b; }
  .queue-panel span { color: inherit; opacity: .86; }
